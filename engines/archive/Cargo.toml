[package]
name = "archive-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox archive engine: create, inspect, test, extract and convert ZIP / TAR / GZIP archives in WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
engine-shared = { path = "../shared" }
# ZIP read/write with Deflate (pure Rust) and AES / ZipCrypto password support.
zip = { version = "2.6", default-features = false, features = ["deflate", "aes-crypto"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
testutil = []

[dev-dependencies]
archive-engine = { path = ".", features = ["testutil"] }

[lints]
workspace = true
