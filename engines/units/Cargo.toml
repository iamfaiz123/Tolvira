[package]
name = "units-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox units & measurement engine: 20 conversion categories with versioned factor tables."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }

[lints]
workspace = true
