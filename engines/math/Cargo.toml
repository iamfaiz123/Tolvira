[package]
name = "math-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox math engine: expression evaluation, fractions, statistics, number theory, algebra, matrices, combinatorics, bases, roman numerals, number words and plotting data."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
engine-shared = { path = "../shared" }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"

[lints]
workspace = true
