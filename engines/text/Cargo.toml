[package]
name = "text-engine"
version = "2.0.0"
edition = "2021"
description = "Dev Toolbox text engine: counting, case conversion, line tools, diff, unicode, encodings, markdown and generators."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
engine-shared = { path = "../shared" }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
unicode-segmentation = "1"
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
similar = "2"

[lints]
workspace = true
