[package]
name = "encoding-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox encoding engine: Base64/Base32/hex, URL & HTML entities, punycode, quoted-printable, MIME words, MessagePack, CBOR and protobuf wire inspection."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }
base64 = "0.22"
percent-encoding = "2"
idna = "1"
rmp-serde = "1"
ciborium = "0.2"
hex = "0.4"

[lints]
workspace = true
