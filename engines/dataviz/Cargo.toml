[package]
name = "dataviz-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox data visualisation engine: SVG charts (bar/line/area/pie/donut/scatter/histogram) from CSV or JSON, histograms & frequency tables, pivot tables, data profiling, descriptive statistics, outlier detection and sampling."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }
tabular-core = { path = "../tabular" }

[lints]
workspace = true
