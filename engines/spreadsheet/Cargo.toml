[package]
name = "spreadsheet-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox spreadsheet engine: read XLSX/XLS/XLSB/ODS (calamine), write XLSX/ODS, convert to/from CSV & JSON, merge/split sheets, clean/dedupe, formula inspection & evaluation, diff."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }
tabular-core = { path = "../tabular" }
calamine = { version = "0.35", default-features = false }
zip = { version = "=7.3.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
