[package]
name = "tabular-core"
version = "1.0.0"
edition = "2021"
description = "Shared tabular-data library (CSV parsing, cleaning, validation, transforms, encodings) used by the csv and spreadsheet engines. No FFI exports."

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }
csv = "1.3"
encoding_rs = "0.8"

[lints]
workspace = true
