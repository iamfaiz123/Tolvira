[package]
name = "mesh3d-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox 3D engine: STL (ASCII/binary) and OBJ parsing, conversion, inspection, volume, transforms, basic repair, GLB↔glTF container handling and software-rendered thumbnails."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
