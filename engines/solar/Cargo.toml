[package]
name = "solar-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox solar & energy engine: PV sizing, ROI/savings, roof area, battery & inverter sizing, backup time, electricity bills (slab tariffs), appliance energy and carbon footprint."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }

[lints]
workspace = true
