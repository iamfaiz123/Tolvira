[package]
name = "audio-engine"
version = "2.0.0"
edition = "2021"
description = "Dev Toolbox audio engine: decode WAV/MP3/FLAC/OGG/AAC/M4A (symphonia), inspect metadata, trim/cut/split/join/loop/reverse, gain/normalize/fade, speed/pitch, EQ/bass/treble, noise reduction, silence removal, waveform/spectrum data, tone generation; encodes WAV and FLAC."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "aac", "isomp4", "ogg", "wav", "pcm", "adpcm", "mkv", "alac"] }
rustfft = "6"
flacenc = { version = "0.4", default-features = false }

[lints]
workspace = true
