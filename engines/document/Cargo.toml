[package]
name = "document-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox document engine: DOCX/ODT/PPTX reading (text, HTML, Markdown, JSON outline, metadata), DOCX template filling, Markdown→DOCX, ODT→DOCX, RTF→text/HTML."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }
zip = { version = "2.6", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
zip = { version = "2.6", default-features = false, features = ["deflate"] }

[lints]
workspace = true
