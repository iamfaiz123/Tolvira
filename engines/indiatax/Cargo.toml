[package]
name = "indiatax-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox India GST & tax rules engine: GST maths, GSTIN/invoice validation, HSN/SAC chapters, TDS, income tax (preset slabs, overridable), salary in-hand, capital gains, bank statement cleaning and GSTR reconciliation."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }
csv = "1.3"

[lints]
workspace = true
