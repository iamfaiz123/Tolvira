[package]
name = "crypto-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox cryptography engine: hashes, HMAC, password hashing, AES-GCM, RSA, JWT, TOTP, UUID/ULID, secure generators and certificate decoding."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
engine-shared = { path = "../shared" }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake3 = { version = "1", default-features = false }
blake2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
bcrypt = { version = "0.17", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
x509-parser = "0.17"
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
uuid = { version = "1", default-features = false, features = ["v3", "v5"] }
base64 = "0.22"
crc32fast = { version = "1", default-features = false }
hex = "0.4"
subtle = "2"

[lints]
workspace = true
