[package]
name = "datetime-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox date & time engine: differences, arithmetic, ages, time zones (IANA), timestamps, business days, week numbers, calendars, meeting planning and cron schedules."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
chrono-tz = "0.10"
cron = "0.15"

[lints]
workspace = true
