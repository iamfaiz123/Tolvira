[package]
name = "json-engine"
version = "1.0.0"
edition = "2021"
description = "Dev Toolbox JSON & structured data engine: JSON, YAML, XML, TOML, INI, plist, CSV conversions, validation, schema, diff, query and code generation."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
engine-shared = { path = "../shared" }
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }
quick-xml = "0.37"
serde_json_path = "0.7"
jsonschema = { version = "0.28", default-features = false }
csv = "1.3"
indexmap = "2"

[lints]
workspace = true
